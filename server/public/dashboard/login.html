<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Gabrial Deora</title>
  <link rel="stylesheet" href="/dashboard/assets/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="login-form">
      <h1>Portfolio Admin</h1>
      <p>Sign in to manage your content</p>
      <div class="form-row">
        <label>Username</label>
        <input type="text" id="username" autocomplete="username" required />
      </div>
      <div class="form-row">
        <label>Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button class="primary" type="submit" style="width: 100%; padding: 10px;">Sign In</button>
      <div class="login-error" id="error"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const error = document.getElementById('error');

    // If already authenticated, go straight to the dashboard
    fetch('/api/auth/status', { credentials: 'include' })
      .then((r) => r.json())
      .then((d) => { if (d.authenticated) window.location.href = '/dashboard'; })
      .catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
        credentials: 'include',
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.authenticated) {
        window.location.href = '/dashboard';
      } else {
        error.textContent = data.error || 'Login failed';
      }
    });
  </script>
</body>
</html>
