<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Smooth Rounded Squircle Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- Inner Ambient Aura -->
  <circle cx="256" cy="256" r="140" fill="url(#primaryGrad)" opacity="0.25" filter="url(#glow)" />

  <!-- Modern Geometric Monogram 'P' (Portfolio & Platform) with Layered CMS facets -->
  <g filter="url(#glow)">
    <!-- Vertical Backbone / Column -->
    <rect x="138" y="118" width="56" height="276" rx="24" fill="url(#primaryGrad)" />

    <!-- Top Loop Segment -->
    <path d="M 170 118 
             H 290 
             C 362 118, 396 156, 396 222 
             C 396 288, 362 326, 290 326 
             H 170 
             Z" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="54" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Headless API Spark & Diamond Node (CMS dynamic data pulse) -->
    <circle cx="282" cy="222" r="28" fill="url(#accentGrad)" />
    <path d="M 282 176 L 286 210 L 320 222 L 286 234 L 282 268 L 278 234 L 244 222 L 278 210 Z" fill="#ffffff" opacity="0.9" />

    <!-- Modern code terminal bracket accent -->
    <path d="M 366 320 L 404 358 L 366 396" fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
